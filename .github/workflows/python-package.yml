name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install validation environment
      run: |
        python -m pip install --upgrade pip
        python -m pip install build flake8
        python -m pip install -r requirements-validation.txt
        python -m pip install -e . --no-deps
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src tests datasets/benchmarkQC --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src tests datasets/benchmarkQC --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: python -m pytest -q
    - name: Build distribution
      run: python -m build
